<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Search History">
  <defs>
    <linearGradient id="bg" x1="64" y1="48" x2="448" y2="472" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#4F46E5"/>
      <stop offset="0.55" stop-color="#7C3AED"/>
      <stop offset="1" stop-color="#9333EA"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.32" cy="0.26" r="0.85">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.28"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0.05"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="lens" x1="150" y1="130" x2="300" y2="300" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#EEF2FF" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#C4B5FD" stop-opacity="0.06"/>
    </linearGradient>
    <filter id="ds" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#1E1B4B" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Badge -->
  <rect x="24" y="24" width="464" height="464" rx="112" fill="url(#bg)"/>
  <rect x="24" y="24" width="464" height="464" rx="112" fill="url(#glow)"/>
  <rect x="24.5" y="24.5" width="463" height="463" rx="111.5" fill="none" stroke="#FFFFFF" stroke-opacity="0.18" stroke-width="1.5"/>

  <!-- Magnifier group -->
  <g filter="url(#ds)">
    <!-- handle -->
    <line x1="300" y1="300" x2="392" y2="392" stroke="#F5F3FF" stroke-width="42" stroke-linecap="round"/>
    <line x1="300" y1="300" x2="392" y2="392" stroke="#C4B5FD" stroke-width="16" stroke-linecap="round" stroke-opacity="0.55"/>

    <!-- lens fill + rim -->
    <circle cx="214" cy="214" r="118" fill="url(#lens)"/>
    <circle cx="214" cy="214" r="118" fill="none" stroke="#F8FAFC" stroke-width="26"/>
    <circle cx="214" cy="214" r="118" fill="none" stroke="#312E81" stroke-opacity="0.12" stroke-width="26"/>
  </g>

  <!-- History clock inside the lens -->
  <g stroke-linecap="round" stroke-linejoin="round">
    <!-- closed clock ring -->
    <circle cx="214" cy="214" r="62" fill="none" stroke="#FBBF24" stroke-width="14"/>
    <!-- hour ticks at 12 / 3 / 6 / 9 -->
    <g stroke="#FCD34D" stroke-width="6" stroke-opacity="0.9">
      <line x1="214" y1="166" x2="214" y2="176"/>
      <line x1="262" y1="214" x2="252" y2="214"/>
      <line x1="214" y1="262" x2="214" y2="252"/>
      <line x1="166" y1="214" x2="176" y2="214"/>
    </g>
    <!-- clock hands (~10:10) -->
    <line x1="214" y1="214" x2="214" y2="176" stroke="#FFFFFF" stroke-width="13"/>
    <line x1="214" y1="214" x2="244" y2="230" stroke="#FFFFFF" stroke-width="13"/>
    <circle cx="214" cy="214" r="8.5" fill="#FFFFFF"/>
  </g>
</svg>
